# Local or single-VPS deployment: `docker compose up -d --build`.
# Needs a .env file next to it with TELEGRAM_BOT_TOKEN (see docs/server.md).
services:
  db:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: otryad
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-otryad}
      POSTGRES_DB: otryad
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U otryad"]
      interval: 5s
      retries: 10
    restart: unless-stopped

  server:
    build: .
    depends_on:
      db:
        condition: service_healthy
    environment:
      DATABASE_URL: postgres://otryad:${POSTGRES_PASSWORD:-otryad}@db:5432/otryad
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      CORS_ORIGIN: ${CORS_ORIGIN:-https://biktorb.github.io}
    ports:
      - "3000:3000"
    restart: unless-stopped

volumes:
  pgdata:
