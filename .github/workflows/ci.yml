name: CI
on:
  pull_request:
  push:
    branches: [main]
jobs:
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        env:
          POSTGRES_USER: otryad
          POSTGRES_PASSWORD: otryad
          POSTGRES_DB: otryad_test
        ports: ["5432:5432"]
        options: >-
          --health-cmd "pg_isready -U otryad" --health-interval 5s --health-retries 10
    env:
      TEST_DATABASE_URL: postgres://otryad:otryad@localhost:5432/otryad_test
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
          cache: npm
      - run: npm ci
      - run: npm run typecheck
      - run: npm test
      - run: npm run build
  docker:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - run: docker build -t otryad .
